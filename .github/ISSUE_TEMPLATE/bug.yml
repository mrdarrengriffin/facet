name: Bug report
description: Something on a panel or the docs site doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. A rough report is far better than none.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        # boards: generated from boards/*.json (node boards/templates.mjs)
        - Waveshare ESP32-P4-86 (720 x 720)
        - Guition ESP32-S3-4848S040 (480 x 480)
        # end boards
        - Another panel
        - Docs site
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware version or browser
      description: On a panel, Home Assistant shows the firmware version on its device page. On the docs site, your browser.
  - type: textarea
    id: report
    attributes:
      label: The panel's problem report
      description: >-
        On a panel, Settings > Report a problem has a QR code that opens this form with the version filled in, and
        shows the address of the panel's report (http://<panel address>/fw/report). Open it on the same network, copy
        all of it and paste it here. It holds the logs from before the last restart, Wi-Fi and Home
        Assistant drops and the last crash, with tokens, keys and passwords removed.
      render: text
  - type: textarea
    id: shots
    attributes:
      label: Photos, screenshots or logs
      description: Drag files in here. Anything you can see is easier to fix with a picture.
