name: Bug report
description: Something on a panel or the docs site doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. A rough report is far better than none.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        # boards: generated from boards/*.json (node boards/templates.mjs)
        - Waveshare ESP32-P4-86 (720 x 720)
        - Guition ESP32-S3-4848S040 (480 x 480)
        # end boards
        - Another panel
        - Docs site
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware version or browser
      description: On a panel, Home Assistant shows the firmware version on its device page. On the docs site, your browser.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: >-
        The panel's problem report. On the panel, open Settings > About > Report a problem: it shows the address of
        the panel's report page, for example http://192.168.1.50/fw/report (the panel's IP address; your router's list
        of devices shows it too). Open that address on a computer on the same Wi-Fi, copy the report (or download
        it) and paste it in here, or attach the file below. It holds the logs from before the last restart, Wi-Fi and
        Home Assistant drops and the last crash, with tokens, keys and passwords removed.
      render: text
  - type: textarea
    id: shots
    attributes:
      label: Photos, screenshots or logs
      description: Drag files in here. Anything you can see is easier to fix with a picture.
