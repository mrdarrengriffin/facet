name: Docs fix
description: Something on the docs site is wrong, unclear or missing.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs fixing
      description: What is wrong or confusing, and what it should say if you know.
    validations:
      required: true
