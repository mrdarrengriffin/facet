name: Idea
description: A screen, a component, a panel, a sound, or a better way to do something.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like, and what would it help you do? Sketches and photos welcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Similar things you have seen, the panel you use, the Home Assistant entities involved.
