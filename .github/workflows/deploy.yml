name: Deploy docs

# The docs site (site/) on GitHub Pages, around the docs flavour of the WASM renderer built in this job from the
# commit it documents (FW_FEATURES=docs renderer/build.sh; renderer/README.md "What a machine needs"). The public firmware
# for the /install page (factory + OTA images, manifest.json + ota.json per board) is the asset of the `firmware`
# release (site/scripts/upload-firmware.sh), unpacked into site/public/firmware/ and served at /facet/firmware/<board>/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - name: LVGL objects (per lv_conf and LVGL)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            renderer/.cache/lvgl-O2
            renderer/.cache/lvgl-O2-*.list
          key: lvgl-${{ hashFiles('renderer/lv_conf.h', 'renderer/third_party/lvgl/lv_version.h') }}
      - run: npm ci
        working-directory: renderer/tools
      - name: Build the WASM docs flavour (both densities)
        run: FW_FEATURES=docs renderer/build.sh
      - name: Download the public firmware (install page + panel updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download firmware -p firmware.tar.gz -R "$GITHUB_REPOSITORY"
          mkdir -p site/public/firmware && tar -xzf firmware.tar.gz -C site/public/firmware
          ls -R site/public/firmware
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          FW_OUT: renderer/out
          FACET_DOCS_BASE: /facet/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  check:
    # the /install page fails with "Failed to download manifest" when these are not served
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Firmware manifests and images are served
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}/firmware"
          sleep 20
          fail=0
          for board in waveshare-p4-86 guition-4848s040; do
            for f in manifest.json ota.json; do
              ok=0
              for try in 1 2 3 4 5 6; do curl -sfL -o "$board-$f" "$base/$board/$f" && { ok=1; break; }; sleep 10; done
              [ $ok = 1 ] || { echo "::error::$base/$board/$f not served"; fail=1; continue; }
              echo "$board/$f: version $(jq -r .version "$board-$f")"
            done
            [ -f "$board-manifest.json" ] || continue
            for bin in $(jq -r '.builds[].parts[].path' "$board-manifest.json") $(jq -r '.builds[].ota.path' "$board-ota.json" 2>/dev/null); do
              code=$(curl -sIL -o /dev/null -w '%{http_code}' "$base/$board/$bin")
              echo "$board/$bin: $code"; [ "$code" = 200 ] || { echo "::error::$base/$board/$bin returned $code"; fail=1; }
            done
          done
          exit $fail
