name: Release

# Versions and channels (RELEASING.md): a tag builds the public firmware for every board on GitHub and publishes it.
#   v0.6.0, v0.6.1  a release: the `firmware` release's firmware.tar.gz (manifest.json + ota.json per board, and the
#                   same as manifest-beta.json + ota-beta.json), the Install page's default and every panel on the
#                   Release update channel; the same tarball is also the `firmware-beta` asset, so Beta gets every
#                   release and never lags behind Release. Its GitHub release is the latest release.
#   v0.6.0-beta.1   a beta of the next version: the `firmware-beta` release's firmware-beta.tar.gz (manifest-beta.json
#                   + ota-beta.json only), the Install page's Beta switch and panels on the Beta update channel. Its
#                   GitHub release is a pre-release.
# The Dev (nightly) channel (ota-dev.json, a nightly build of main) is dev.yml's. Each tag gets its own GitHub
# release with both boards' images. Checks, each stops the run: CI and Firmware
# succeeded on the tagged commit (waits for them while they run); the tag carries release-notes/<version>.md (the
# release body and, short, the update card's notes: firmware/release-notes.mjs); a release tag's esphome/facet-*.yaml say
# facet_version: <version> (a beta's are stamped at build); every image says the version (build and project) and
# never "+wip" (both boards' images: firmware-build.yml, shared with dev.yml). Then the docs deploy runs, which serves
# every channel (deploy.yml).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: {description: 'An existing tag to build again (v0.6.0, v0.6.0-beta.1)', required: true}

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {ref: '${{ env.TAG }}', fetch-depth: 0}   # the whole history: the Firmware check finds the last firmware change with git log
      - id: v
        name: Version and channel
        run: |
          V=${TAG#v}
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-beta.N"; exit 1; }
          C=$([[ "$V" == *-* ]] && echo beta || echo release)
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "channel=$C" >> "$GITHUB_OUTPUT"
          echo "$TAG: version $V, channel $C" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A release tag's YAMLs say its version
        if: steps.v.outputs.channel == 'release'
        run: |
          for y in esphome/facet-*.yaml; do
            v=$(sed -n 's/^ *facet_version: *\([^ #]*\).*/\1/p' "$y")
            [ "$v" = "${{ steps.v.outputs.version }}" ] || { echo "::error::$y says facet_version $v"; exit 1; }
          done
      - name: The version's release notes (release-notes/<version>.md, RELEASING.md)
        run: |
          out=$(node firmware/release-notes.mjs check "${{ steps.v.outputs.version }}")
          echo "$out" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: CI green on the tagged commit, Firmware on the run that covers it
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          sha=$(git rev-parse HEAD)
          # Firmware runs only when its paths change, and on a push's head only: the newest Firmware run on main whose
          # commit holds the last firmware change and is in the tag's history counts (as dev.yml does)
          fw=$(git log -1 --format=%H "$sha" -- renderer firmware esphome boards renderer/tools/synth.ts .github/workflows/firmware.yml)
          for h in $(gh run list --workflow firmware.yml --branch main -L 30 --json headSha -q '.[].headSha'); do
            if git merge-base --is-ancestor "$fw" "$h" 2>/dev/null && git merge-base --is-ancestor "$h" "$sha"; then fw=$h; break; fi
          done
          for i in $(seq 1 60); do
            ci=$(gh run list --commit "$sha" --workflow ci.yml --json status,conclusion -q '.[0] | "\(.status)/\(.conclusion)"')
            fr=$(gh run list --commit "$fw" --workflow firmware.yml --json status,conclusion -q '.[0] | "\(.status)/\(.conclusion)"')
            [ "$ci" = completed/success ] && [ "$fr" = completed/success ] && { echo "CI green on $sha, Firmware on $fw"; exit 0; }
            for r in "CI $ci" "Firmware $fr"; do case "$r" in *completed/success|*" "|*in_progress*|*queued*|*pending*|*waiting*) ;; *completed/*) echo "::error::$r"; exit 1;; esac; done
            sleep 30
          done
          echo "::error::CI did not finish on $sha within 30 minutes"; exit 1

  build:
    needs: check
    uses: ./.github/workflows/firmware-build.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      version: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.check.outputs.version }}
      CH: ${{ needs.check.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {ref: '${{ env.TAG }}', fetch-depth: 0}   # every tag: the previous one, for the full-changelog link
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: {node-version: 24}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: {pattern: 'fw-*', path: out, merge-multiple: true}
      - name: Manifests (the channel's names)
        run: node firmware/manifests.mjs out "$V"
      - name: This tag's release (the version's notes as its body; images attached; a pre-release for a beta, else the latest)
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          node firmware/release-notes.mjs body "$V" "$prev" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then gh release edit "$TAG" --notes-file notes.md
          else gh release create "$TAG" --verify-tag --title "Facet $V" --notes-file notes.md $([ "$CH" = beta ] && echo --prerelease || echo --latest); fi
          gh release upload "$TAG" out/*/*.bin --clobber
      - name: The channels' firmware assets (what the docs site serves; a release is Release's and Beta's)
        run: |
          for R in $([ "$CH" = beta ] && echo firmware-beta || echo firmware firmware-beta); do
            C=$([ "$R" = firmware-beta ] && echo beta || echo release)
            tar -czf "$R.tar.gz" -C out .
            gh release view "$R" >/dev/null 2>&1 || gh release create "$R" --title "Firmware ($C channel, install page)" --notes "The $C channel's images and manifests, served by the docs site. Replaced by every $C tag$([ "$C" = beta ] && echo ' and every release')." --prerelease --target main
            gh release upload "$R" "$R.tar.gz" --clobber
            git tag -f "$R" && git push -f origin "refs/tags/$R"   # the channel tag follows the build it serves
            echo "$R.tar.gz: $V" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Deploy the docs site (serves every channel)
        run: gh workflow run deploy.yml --ref main
