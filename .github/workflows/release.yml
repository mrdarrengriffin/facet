name: Release

# Release channels (RELEASING.md): a tag builds the public firmware for every board on GitHub and publishes it.
#   v1.0.0          stable: the `firmware` release's firmware.tar.gz (manifest.json + ota.json per board), the
#                   Install page's default and every panel on the Stable update channel
#   v0.5.0-beta.1   beta: the `firmware-beta` release's firmware-beta.tar.gz (manifest-beta.json + ota-beta.json),
#                   the Install page's Beta switch and panels on the Beta update channel
# Dev builds (this repo's workbench builds on the owner's panels) are never published. Each tag also gets its own
# GitHub release (a pre-release for a beta) with both boards' images. Checks, each stops the run: CI and Firmware
# succeeded on the tagged commit (waits for them while they run); a stable tag's esphome/facet-*.yaml say
# facet_version: <version>; every image says the version and never "+wip". Then the docs deploy runs, which serves
# both channels (deploy.yml).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: {description: 'An existing tag to build again (v0.5.0-beta.1)', required: true}

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {ref: '${{ env.TAG }}'}
      - id: v
        name: Version and channel
        run: |
          V=${TAG#v}
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]] || { echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-beta.N"; exit 1; }
          C=$([[ "$V" == *-* ]] && echo beta || echo stable)
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "channel=$C" >> "$GITHUB_OUTPUT"
          echo "$TAG: version $V, channel $C" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A stable tag's YAMLs say its version
        if: steps.v.outputs.channel == 'stable'
        run: |
          for y in esphome/facet-*.yaml; do
            v=$(sed -n 's/^ *facet_version: *\([^ #]*\).*/\1/p' "$y")
            [ "$v" = "${{ steps.v.outputs.version }}" ] || { echo "::error::$y says facet_version $v"; exit 1; }
          done
      - name: CI and Firmware green on the tagged commit
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          sha=$(git rev-parse HEAD)
          for i in $(seq 1 60); do
            runs=$(gh run list --commit "$sha" --json workflowName,status,conclusion -q '.[] | "\(.workflowName)=\(.status)/\(.conclusion)"')
            ok=1; for w in CI Firmware; do grep -qx "$w=completed/success" <<<"$runs" || ok=0; done
            [ $ok = 1 ] && { echo "CI green on $sha"; exit 0; }
            grep -E "^(CI|Firmware)=completed/" <<<"$runs" | grep -v "/success$" && { echo "::error::CI not green on $sha"; exit 1; }
            sleep 30
          done
          echo "::error::CI did not finish on $sha within 30 minutes"; exit 1

  build:
    needs: check
    strategy:
      matrix:
        include:
          - {board: waveshare-p4-86, density: 1.5x}
          - {board: guition-4848s040, density: 1x}
    name: build ${{ matrix.board }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ESPHOME_BUILD_ROOT: ${{ github.workspace }}/.esphome-build
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CHROMIUM_PATH: /usr/bin/google-chrome
      V: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {ref: '${{ env.TAG }}'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            renderer/tools/package-lock.json
            workbench/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - run: sudo apt-get install -y --no-install-recommends ccache
      - run: pip install esphome==2026.9.1
      - run: npm ci
        working-directory: renderer/tools
      - run: npm ci
        working-directory: workbench   # the panel's editor (esphome/build.sh: workbench/scripts/editor-device.mjs)
      - name: ESP-IDF toolchain (per ESPHome version)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esphome-idf-2026.9.1
      - name: ESPHome build folder + ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .esphome-build
            .ccache
          key: fw-${{ matrix.board }}-${{ github.sha }}
          restore-keys: fw-${{ matrix.board }}-
      - name: Sound bank (per its inputs; rendered only when they change)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: esphome/components/facet_audio/facet_sounds*
          key: sound-bank-${{ hashFiles('renderer/tokens/sound.json', 'renderer/tools/synth.ts', 'firmware/sound_bank.mjs') }}
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - name: LVGL objects (per lv_conf and LVGL)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            renderer/.cache/lvgl-O2
            renderer/.cache/lvgl-O2-*.list
          key: lvgl-${{ hashFiles('renderer/lv_conf.h', 'renderer/third_party/lvgl/lv_version.h') }}
      - name: WASM build at the board's density (the bundle checks the deck it bakes in)
        run: renderer/build.sh ${{ matrix.density }}
      - name: Compile (FACET_VERSION = the tag's version)
        run: FACET_VERSION="$V" esphome/build.sh ${{ matrix.board }} compile
      - name: The images, checked
        run: |
          b=${{ matrix.board }}
          suffix=$(sed -n 's/^ *build_suffix: *"\([^"]*\)".*/\1/p' esphome/facet-$b.yaml)
          name=$(sed -n 's/^ *name: *\([a-z0-9-]*\).*/\1/p' esphome/facet-$b.yaml | head -1)
          B="$ESPHOME_BUILD_ROOT/$name$suffix/build"
          mkdir -p out/$b
          cp "$B/firmware.factory.bin" out/$b/facet-$b-$V.factory.bin
          cp "$B/firmware.ota.bin" out/$b/facet-$b-$V.ota.bin
          txt=$(strings out/$b/facet-$b-$V.ota.bin)
          grep -qx -- "$V" <<<"$txt" || { echo "::error::$b: the image does not say $V"; exit 1; }
          ! grep -q -- '+wip' <<<"$txt" || { echo "::error::$b: the image says +wip"; exit 1; }
          echo "$b: $V, $(du -h out/$b/facet-$b-$V.ota.bin | cut -f1) OTA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fw-${{ matrix.board }}
          path: out/

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.check.outputs.version }}
      CH: ${{ needs.check.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {ref: '${{ env.TAG }}'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: {node-version: 24}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: {pattern: 'fw-*', path: out, merge-multiple: true}
      - name: Manifests (the channel's names)
        run: node firmware/manifests.mjs out "$V" "$(git rev-parse --short HEAD)"
      - name: This tag's release (images attached; a pre-release for a beta)
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Facet $V" --generate-notes $([ "$CH" = beta ] && echo --prerelease)
          gh release upload "$TAG" out/*/*.bin --clobber
      - name: The channel's firmware asset (what the docs site serves)
        run: |
          R=$([ "$CH" = beta ] && echo firmware-beta || echo firmware)
          tar -czf "$R.tar.gz" -C out .
          gh release view "$R" >/dev/null 2>&1 || gh release create "$R" --title "Firmware ($CH channel, install page)" --notes "The $CH channel's images and manifests, served by the docs site. Replaced by every $CH tag." --prerelease --target main
          gh release upload "$R" "$R.tar.gz" --clobber
          git tag -f "$R" && git push -f origin "refs/tags/$R"   # the channel tag follows the build it serves
          echo "$R.tar.gz: $V" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy the docs site (serves both channels)
        run: gh workflow run deploy.yml --ref main
