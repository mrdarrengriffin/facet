name: Firmware

# Pull requests (and main, which keeps the caches warm for them): the Waveshare firmware compiles from this repo
# (renderer/build.sh 1.5x for the bundle's deck check, then esphome/build.sh waveshare-p4-86: bundle, settings
# package, sound bank, esphome compile). No flash, no release.
# Warm = ESP-IDF toolchain, ESPHome build folder and ccache restored; a renderer change then recompiles only what it
# touches.

on:
  pull_request:
    paths: ['renderer/**', 'firmware/**', 'esphome/**', 'boards/**', 'renderer/tools/synth.ts', '.github/workflows/firmware.yml']
  push:
    branches: [main]
    paths: ['renderer/**', 'firmware/**', 'esphome/**', 'boards/**', 'renderer/tools/synth.ts', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile waveshare-p4-86
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ESPHOME_BUILD_ROOT: ${{ github.workspace }}/.esphome-build
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            renderer/tools/package-lock.json
            workbench/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: ccache (optional; retried, the build runs without it if Ubuntu's mirrors are down)
        run: |
          for i in 1 2 3; do
            sudo apt-get install -y --no-install-recommends ccache && break
            sudo apt-get update -o Acquire::Retries=3 || true; sleep $((i * 15))
          done
          if ! command -v ccache >/dev/null; then
            echo "::warning::ccache not installed (apt mirrors unreachable); building without it"
            echo "EM_COMPILER_WRAPPER=" >> "$GITHUB_ENV"
            echo "IDF_CCACHE_ENABLE=0" >> "$GITHUB_ENV"
          fi
      - run: pip install esphome==2026.9.1
      - run: npm ci
        working-directory: renderer/tools
      - run: npm ci
        working-directory: workbench   # the panel's editor (esphome/build.sh: workbench/scripts/editor-device.mjs)
      - name: ESP-IDF toolchain (per ESPHome version)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esphome-idf-2026.9.1
      - name: ESPHome build folder + ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .esphome-build
            .ccache
          key: fw-waveshare-p4-86-${{ github.sha }}
          restore-keys: fw-waveshare-p4-86-
      - name: Sound bank (per its inputs; rendered only when they change)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: esphome/components/facet_audio/facet_sounds*
          key: sound-bank-${{ hashFiles('renderer/tokens/sound.json', 'renderer/tools/synth.ts', 'firmware/sound_bank.mjs') }}
      # the bundle checks the deck it bakes in with the panel's own check, run in this commit's WASM build (C54)
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - name: LVGL objects (per lv_conf and LVGL)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            renderer/.cache/lvgl-O2
            renderer/.cache/lvgl-O2-*.list
          key: lvgl-${{ hashFiles('renderer/lv_conf.h', 'renderer/third_party/lvgl/lv_version.h') }}
      - name: WASM build (1.5x, the board's density)
        run: renderer/build.sh 1.5x
      - name: Generate (bundle, settings, sound bank)
        run: esphome/build.sh waveshare-p4-86 prepare
      - name: Compile
        run: |
          t0=$SECONDS; rc=0
          esphome/build.sh waveshare-p4-86 compile > compile.log 2>&1 || rc=$?
          sed 's/\x1b\[[0-9;]*[mK]//g' compile.log | grep -E "RAM:|Flash:|error:|FAILED" | head -20 || true
          n=$(sed 's/\r/\n/g' compile.log | grep -cE "Building (C|CXX|ASM) object" || true)
          echo "compile: $((SECONDS - t0)) s, $n objects compiled (rc $rc)" | tee -a "$GITHUB_STEP_SUMMARY"
          (ccache -s || true) | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Compile log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: compile-log
          path: compile.log
