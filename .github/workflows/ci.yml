name: CI

# Every push to main and every pull request: the renderer is built from this repo alone (LVGL, ArduinoJson, lv_conf.h,
# fonts vendored; renderer/README.md "What a machine needs") and the gate tier runs against it (renderer/check.sh gate:
# every rule at both densities, the functional suites, goldens as raw 565). Logs of a failed step are uploaded.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: renderer/tools/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - name: LVGL objects (per lv_conf and LVGL)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            renderer/.cache/lvgl-O2
            renderer/.cache/lvgl-O2-*.list
          key: lvgl-${{ hashFiles('renderer/lv_conf.h', 'renderer/third_party/lvgl/lv_version.h') }}
      - run: npm ci
        working-directory: renderer/tools
      - name: Feature flags (every source in one feature, shown features complete)
        run: node renderer/tools/features.mjs check
      - name: JSON sources parse
        run: |
          for f in renderer/specs/*.json renderer/specs/examples/*.json renderer/tokens/*.json renderer/features.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" || { echo "bad JSON: $f"; exit 1; }
          done
      - name: Build (both densities)
        run: renderer/build.sh
      - name: Gate
        run: CHECK_LOG=renderer/.cache/checks/gate renderer/check.sh gate
      - name: Gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gate-logs
          path: renderer/.cache/checks/
